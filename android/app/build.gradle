plugins {
    id "com.android.application"
}

def opuromCompileSdk = Integer.parseInt((project.findProperty("opuromCompileSdk") ?: "36").toString())
def opuromTargetSdk = Integer.parseInt((project.findProperty("opuromTargetSdk") ?: "36").toString())
def opuromMinSdk = Integer.parseInt((project.findProperty("opuromMinSdk") ?: "24").toString())
def opuromNdkVersion = (project.findProperty("opuromNdkVersion") ?: "27.2.12479018").toString()

android {
    namespace "org.opurom.mobile"
    compileSdk opuromCompileSdk
    ndkVersion = opuromNdkVersion

    defaultConfig {
        applicationId "org.opurom.mobile"
        minSdk opuromMinSdk
        targetSdk opuromTargetSdk
        versionCode 1
        versionName "0.1.0"
    }

    sourceSets {
        main {
            // The JNI class is shipped once at the repository root and shared with every slice.
            java.srcDirs += "../../jni"
            // Populated by the NDK build in verify.mjs; build output, not committed.
            jniLibs.srcDirs += ["../../target/android/jniLibs"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
